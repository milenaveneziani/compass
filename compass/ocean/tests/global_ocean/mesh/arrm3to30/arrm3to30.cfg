# Options for spherical meshes
[spherical_mesh]

# Whether to convert the culled mesh file to CDF5 format
convert_culled_mesh_to_cdf5 = True


# Options related to adjusting the sea-surface height or land-ice pressure
# below ice shelves to they are dynamically consistent with one another
[ssh_adjustment]

# Whether to convert adjusted initial condition files to CDF5 format during
# ssh adjustment under ice shelves
convert_to_cdf5 = True


# The io section describes options related to file i/o
[io]

# the NetCDF file format: NETCDF4, NETCDF4_CLASSIC, NETCDF3_64BIT, or
# NETCDF3_CLASSIC
format = NETCDF4

# the NetCDF output engine: netcdf4 or scipy
engine = netcdf4


# Config options related to initial condition and diagnostics support files
# for E3SM
[files_for_e3sm]

# whether to convert to CDF5 format
convert_to_cdf5 = True

# Options related to the vertical grid
[vertical_grid]

# the type of vertical grid
grid_type = tanh_dz

# Number of vertical levels
vert_levels = 80

# Depth of the bottom of the ocean
bottom_depth = 5500.0

# The minimum layer thickness
min_layer_thickness = 2.0

# The maximum layer thickness
max_layer_thickness = 150.0


# options for global ocean testcases
[global_ocean]

## config options related to the initial_state step

# minimum number of vertical levels, both in the open ocean and in ice-shelf
# cavities
min_levels = 5

# minimum thickness of layers in ice-shelf cavities
cavity_min_layer_thickness = 2.0

# number of cores to use
init_ntasks = 256
# minimum of cores, below which the step fails
init_min_tasks = 64

# the approximate number of cells in the mesh
approx_cell_count = 2500000

## metadata related to the mesh
# the prefix (e.g. QU, EC, WC, SO)
prefix = ARRM
# a description of the mesh and initial condition
mesh_description = MPAS Arctic Regionally Refined Mesh (ARRM) for E3SM version
                   ${e3sm_version}, with ${min_res}-km resolution in the Arctic
                    and <<<levels>>> vertical levels

# E3SM version that the mesh is intended for
e3sm_version = 3
# The revision number of the mesh, which should be incremented each time the
# mesh is revised
mesh_revision = 1
# the minimum (finest) resolution in the mesh
min_res = 3
# the maximum (coarsest) resolution in the mesh, can be the same as min_res
max_res = 30
# The URL of the pull request documenting the creation of the mesh
pull_request = https://github.com/MPAS-Dev/compass/pull/414
